{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ShopSphere{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'products/css/style.css' %}">
</head>

<body>

    <header>
        <h1>ShopSphere</h1>

        <nav>
            <a href="{% url 'product_list' %}">Home</a>
            <a href="{% url 'cart_detail' %}">Cart</a>

            {% if user.is_authenticated %}

    <span>
        Welcome, {{ user.username }}
    </span>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

{% else %}

    <a href="{% url 'register' %}">Register</a>

    <a href="{% url 'login' %}">Login</a>

{% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Copyright &copy; 2026 ShopSphere</p>
    </footer>

</body>
</html>
